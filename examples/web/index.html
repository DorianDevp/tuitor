<!doctype html>
<html lang="en">
  <head>

    <title>tuitor web example</title>

      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; }
      td, th { padding: 0.2rem 1rem 0.2rem 0; text-align: left; }
      td:last-child { text-align: right; }

</html>
