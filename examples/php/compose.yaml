# The same script in a container: Xdebug connects out to tuitor on the host.
services:
  php:
    build: .
    volumes: [".:/app"]   # mapped back to this directory in .vscode/launch.json
    working_dir: /app
    extra_hosts: ["host.docker.internal:host-gateway"]   # needed on Linux
    environment:
      XDEBUG_MODE: debug
      XDEBUG_SESSION: "1"
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
    command: ["php", "orders.php"]
