# Which screenshots (docs/screenshots/render.sh) and demos (docs/tapes/<name>.tape) the
# visuals workflow makes again, by the files that a change to shows in them. Paths are globs
# from the repository's root (`*` crosses directories). docs/tapes/changed.py reads this.
#
# A change to a file in [all] makes every picture and demo again: what draws every screen
# (the frame, bars, colours, logo, key hints), and the tools that make the pictures. Logic
# that only changes what a view shows is listed under that view, so a change to app.rs alone
# makes nothing again; run the workflow by hand with "all" when a change shows everywhere.

[all]
paths = [
    "crates/tuitor/src/ui/mod.rs",
    "crates/tuitor/src/ui/paint.rs",
    "crates/tuitor/src/ui/theme.rs",
    "crates/tuitor/src/ui/logo.rs",
    "crates/tuitor/src/default_keys.toml",
    "crates/tuitor-core/src/palette.rs",
    "docs/screenshots/render.sh",
    "docs/screenshots/ansi2html.py",
    "docs/tapes/settings.tape",
    "docs/tapes/home.sh",
]

