[workspace]
resolver = "3"
members = ["crates/tuitor-dap", "crates/tuitor-core", "crates/tuitor-code", "crates/tuitor"]
# Each example is a project of its own, built from its directory.
exclude = ["examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Let chains, and the newest of the dependencies' own rust-version.
rust-version = "1.88"
license = "MIT"
authors = ["Dorian Donoch"]
repository = "https://github.com/DorianDevp/tuitor"
homepage = "https://doriandevp.github.io/tuitor/"
keywords = ["debugger", "dap", "tui", "terminal", "debug-adapter-protocol"]
categories = ["development-tools::debugging", "command-line-utilities"]

[workspace.dependencies]
# The versions are for crates.io, where each is published on its own.
tuitor-dap = { path = "crates/tuitor-dap", version = "0.1.0" }
tuitor-core = { path = "crates/tuitor-core", version = "0.1.0" }
tuitor-code = { path = "crates/tuitor-code", version = "0.1.0" }

anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
# Job control: an editor in a process group of its own that can stop and go on.
nix = { version = "0.31", default-features = false, features = ["signal", "process", "term"] }
# Xdebug traces, which Xdebug gzips when it can (xdebug.use_compression).
flate2 = "1"
futures = "0.3"
ignore = "0.4"
nucleo-matcher = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
# compose files, read without docker; no encodings but UTF-8 needed.
yaml-rust2 = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
